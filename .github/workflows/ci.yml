name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The starter project lives outside the workspace and depends on the
      # engine through git; build it against this checkout so it cannot rot.
      - name: Check the template
        shell: bash
        run: >
          cargo check --manifest-path template/Cargo.toml --target-dir target
          --config 'patch."https://github.com/kuba5056/Jewish-Game-Engine".engine.path="crates/engine"'
