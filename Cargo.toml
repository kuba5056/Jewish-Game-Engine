[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
engine = { path = "crates/engine" }
engine_assets = { path = "crates/engine_assets" }
engine_audio = { path = "crates/engine_audio" }
engine_core = { path = "crates/engine_core" }
engine_physics = { path = "crates/engine_physics" }
engine_platform = { path = "crates/engine_platform" }
engine_render = { path = "crates/engine_render" }
engine_scene = { path = "crates/engine_scene" }
engine_script = { path = "crates/engine_script" }
engine_ui = { path = "crates/engine_ui" }
log = "0.4"
env_logger = "0.11"
winit = "0.30"
hecs = "0.11"
gltf = "1.4"
wgpu = "30"
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rapier3d = "0.36"
# Without the default "cpal-realtime-dbus" feature, which needs libdbus headers to build.
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
# No "clipboard" or "links": they pull in extra system integration the debug UI does not need.
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# f32 floats match the engine's math types, so scripts need no conversions.
rhai = { version = "1", features = ["f32_float"] }
